name: Deploy to Heroku

# Continuous deployment: production deploys happen automatically when code
# lands on main (i.e. after a PR is reviewed, CI passes, and it is merged).
#
# Requires these repository secrets (Settings -> Secrets and variables -> Actions):
#   HEROKU_API_KEY    - from `heroku authorizations:create`
#   HEROKU_APP_NAME   - e.g. openlaw-backend-d0f6778fbe50
#   HEROKU_EMAIL      - the Heroku account email

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@v3.13.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ secrets.HEROKU_APP_NAME }}
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
